# ============================================================
# Template profile for a future single-Oracle-instance deployment.
# Activate with: --spring.profiles.active=oracle (values below still need to be
# supplied via env vars / a secrets store - nothing here is a real credential).
#
# This profile only proves the "schema name from config" seam end-to-end against
# Oracle's naming rules (no lowercase-unquoted defaults like H2). It intentionally does
# NOT split modules across separate servers/databases yet - true per-module servers is a
# bigger follow-up (one DataSource + one EntityManagerFactory per module/schema, with
# routing so each module's repositories bind to the right one) that build on this same
# qh.schemas.* seam. See the "چند سرور جدا" note in README before wiring that up.
#
# Not wired up yet: an Oracle JDBC driver dependency (com.oracle.database.jdbc:ojdbc11)
# in qh-app/pom.xml. Add it before activating this profile for real.
# ============================================================
qh:
  schemas:
    reference: REFERENCE
    core: CORE
    commonrules: COMMONRULES
    deposit: DEPOSIT
    loan: LOAN
    party: PARTY

spring:
  datasource:
    url: ${QH_DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${QH_DB_USERNAME}
    password: ${QH_DB_PASSWORD}

  jpa:
    hibernate:
      # Never auto-manage schema/DDL against a real database - migrate explicitly instead.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        hbm2ddl:
          create_namespaces: false

  sql:
    init:
      # The H2 demo seed files are for the in-memory profile only.
      mode: never
