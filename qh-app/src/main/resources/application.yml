# Physical schema name for each persistence unit's logical @Table(schema = "...") - resolved at
# Hibernate DDL/SQL-generation time by ConfigurableSchemaNamingStrategy (qh-common). Change a value
# here (or override it in a profile, e.g. application-oracle.yml) to move a persistence unit to a
# differently named schema without touching any entity.
#
# There are exactly two logical schemas, matching the two real bounded contexts / persistence units
# below - "productbuilder" (reference+core+commonrules+deposit+loan: one domain, always co-located)
# and "party" (fully independent). See README's "Domain vs Schema" section.
qh:
  schemas:
    productbuilder: PRODUCTBUILDER
    party: PARTY

  # Each persistence unit's own DataSource - see ir.bank.qh.app.config
  # (ProductBuilderPersistenceConfig / PartyPersistenceConfig) for how these are wired. Two
  # separate in-memory H2 databases by default; point either one at a different server (e.g.
  # Oracle) by overriding these same qh.datasources.* keys in a profile - see
  # application-oracle.yml - with no code change.
  datasources:
    productbuilder:
      url: jdbc:h2:mem:qh_productbuilder;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
    party:
      url: jdbc:h2:mem:qh_party;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
      driver-class-name: org.h2.Driver
      username: sa
      password: ""

spring:
  application:
    name: qh-productbuilder

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Shared Hibernate behaviour for BOTH persistence units (see ir.bank.qh.app.config.JpaUnitSupport,
  # which binds these instead of Spring Boot's normal single-DataSource JPA auto-configuration).
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Each persistence unit's schema (see qh.schemas.* above) is created via "CREATE SCHEMA IF
        # NOT EXISTS ..." instead of failing because the schema doesn't exist yet.
        hbm2ddl:
          create_namespaces: true
        jdbc:
          time_zone: UTC
    open-in-view: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ir.bank.qh: INFO
    org.hibernate.SQL: DEBUG
